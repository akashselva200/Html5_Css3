<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ps9.css">
</head>
<body>

    <form method="post"  action="/project/1">
        <fieldset id="personal_information">
            <legend>Create New Account</legend>
            <ol>
                <li>
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" value="" autocomplete="off" placeholder="8-10 characters"
                    pattern="^(?=.{8,})(?=.*[a-z])(?=.*[A-Z])(?=.*[\d])(?=.*[\w]).*$" title="Password must be 8 or more characters with atleast one number, an upper letter, and one special characters"/>
                </li>
                <li>
                    <label for="password_confirmation">Password Confirmation</label>
                    <input type="password" name="password_confirmation" id="password_confirmation" value="" autocomplete="off" placeholder="Type your password again" pattern="^(?=.{8,})(?=.*[a-z])(?=.*[A-Z])(?=.*[\d])(?=.*[\w]).*$" title="Password must be 8 or more characters with atleast one number, an upper letter, and one special characters"/>
                </li>

                <li>
                    <input type="submit" value="sign Up">
                </li>
            </ol>

        </fieldset>
    </form>
    
</body>
</html>
