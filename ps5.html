<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ps5.css">
</head>
<body>

    <form method="post"  action="/project/1">
        <fieldset id="personal_information">
            <legend>Project information</legend>
            <ol>
                <li>
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name">
                </li>
                <li>
                    <label for="priority">Priority</label>
                    <input type="range" min="0" max="10">
                </li>
                <li>
                    <label for="estimated_hours">Estimated Hours</label>
                    <input type="number" name="estimated_hours"
                    min="0" max="1000" id="estimated_hours">
                </li>
                <li>
                    <label for="start_date">Start date</label>
                    <input type="date" name="start_date" id="start_date"
                    value="2024.10.01">
                </li>
                <li>
                    <label for="email">Email contact</label>
                    <input type="email" name="email" id="email">
                </li>
                <li>
                    <label for="url">staging URL</label>
                    <input type="url" name="url" id="url">
                </li>
                <li>
                    <label for="project_color">Project color</label>
                    <input type="color" name="project_color" id="project_color">
                </li>



                <li>
                    <input type="submit" value="submit">
                </li>
            </ol>

        </fieldset>
    </form>
    
</body>
</html>
